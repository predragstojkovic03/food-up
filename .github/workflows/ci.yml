name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=shared
      - name: Typecheck server
        run: npx tsc --noEmit -p apps/server/tsconfig.json
      - name: Typecheck web
        run: npx tsc -b apps/web
      - name: Server unit tests
        run: npm run test --workspace=apps/server
      - name: Web unit tests
        run: npm run test --workspace=apps/web

  integration:
    name: Integration and end-to-end tests (Postgres + Redis via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=shared
      - run: npm run test:e2e
